<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Fix Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1055;
            display: none !important;
            width: 100%;
            height: 100%;
            overflow: hidden;
            outline: 0;
            visibility: hidden;
        }

        .modal.show {
            display: flex !important;
            visibility: visible !important;
            z-index: 1055 !important;
        }

        #testModal.show {
            display: flex !important;
            visibility: visible !important;
            z-index: 1055 !important;
        }

        .modal-backdrop,
        .offcanvas-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1050;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }

        .modal-backdrop.show,
        .offcanvas-backdrop.show {
            opacity: 0.5;
        }

        /* Modal Dialog */
        #testModal .modal-dialog {
            margin: 0 !important;
            max-width: 100% !important;
            width: 100% !important;
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            top: auto !important;
            z-index: 1060 !important;
            display: flex !important;
            flex-direction: column !important;
            transform: none !important;
            justify-content: flex-end !important;
            align-items: stretch !important;
        }

        #testModal .modal-dialog.modal-dialog-centered {
            align-items: stretch !important;
            justify-content: flex-end !important;
        }

        #testModal .modal-dialog.modal-dialog-scrollable {
            display: flex !important;
            flex-direction: column !important;
        }

        #testModal .modal-content {
            border-radius: 20px 20px 0 0 !important;
            max-height: 93vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex !important;
            flex-direction: column !important;
            flex-grow: 1 !important;
            visibility: visible !important;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Modal Fix Test</h1>
        <button id="testBtn" class="btn btn-primary">Click to Show Modal</button>
    </div>

    <!-- Test Modal -->
    <div class="modal fade" id="testModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Test Modal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>If you can see this, the modal is working! ✓</p>
                    <p>This is a test to verify the CSS fixes are working correctly.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Backdrop -->
    <div id="testBackdrop" class="modal-backdrop fade" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const testBtn = document.getElementById('testBtn');
        const testModal = document.getElementById('testModal');
        const backdrop = document.getElementById('testBackdrop');

        testBtn.addEventListener('click', function() {
            console.log('Button clicked!');
            testModal.classList.add('show');
            backdrop.classList.add('show');
            backdrop.style.display = 'block';
            console.log('Modal class:', testModal.className);
            console.log('Modal display:', window.getComputedStyle(testModal).display);
            console.log('Modal visibility:', window.getComputedStyle(testModal).visibility);
        });
    </script>
</body>
</html>
